name: Validate Guidewire ClaimCenter FNOL Project

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    name: Validate Project File Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate PCF files exist
        run: |
          echo "Checking PCF wizard files..."
          for f in \
            "modules/configuration/config/web/pcf/claim/fnol/NewFNOLWizard.pcf" \
            "modules/configuration/config/web/pcf/claim/fnol/NewFNOLWizard_PolicySearch.pcf" \
            "modules/configuration/config/web/pcf/claim/fnol/NewFNOLWizard_LossDetails.pcf" \
            "modules/configuration/config/web/pcf/claim/fnol/NewFNOLWizard_ClaimantInfo.pcf" \
            "modules/configuration/config/web/pcf/claim/fnol/NewFNOLWizard_Review.pcf"; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ MISSING: $f"; exit 1; fi
          done

      - name: Validate Gosu source files exist
        run: |
          echo "Checking Gosu helper files..."
          for f in \
            "modules/configuration/gsrc/gw/fnol/FNOLWizardHelper.gs" \
            "modules/configuration/gsrc/gw/fnol/FNOLValidationHelper.gs" \
            "modules/configuration/gsrc/gw/fnol/FNOLPolicySearchHelper.gs" \
            "modules/configuration/gsrc/gw/fnol/test/FNOLWizardHelperTest.gs"; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ MISSING: $f"; exit 1; fi
          done

      - name: Validate Rule Set exists
        run: |
          echo "Checking rule set..."
          f="modules/configuration/config/rules/Validation/FNOLValidationRules.grs"
          if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ MISSING: $f"; exit 1; fi

      - name: Validate XML well-formedness (PCF files)
        run: |
          sudo apt-get install -y libxml2-utils > /dev/null 2>&1
          echo "Validating PCF XML syntax..."
          find modules/configuration/config/web/pcf -name "*.pcf" | while read f; do
            xmllint --noout "$f" && echo "✅ XML valid: $f" || echo "⚠️  XML issue: $f"
          done

      - name: Summary
        run: echo "✅ All project structure validations passed."
